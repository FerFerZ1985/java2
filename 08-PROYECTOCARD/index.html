<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Cards</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script defer src="app.js"></script>
</head>
<body>
    <div class="contenedor-principal">

        <!--Filtros-->
        <div class="contenedor-filtros" id="filtros">
            <div class="contenedor-input">
                <i class="bx bx-search"></i>
                <input type="text" placeholder="Busqueda">
            </div>

            <div class="contenedor-botones" id="botones">
                <button class="btn active" data-filtro="todo">Todo</button>
                <button class="btn" data-filtro="peliculas">Peliculas</button>
                <button class="btn" data-filtro="series">Series</button>
                <button class="btn" data-filtro="videojuegos">Videojuegos</button>
            </div>
        </div>

        <!--Contenedor de Cards/Imagenes-->
        <div class="contenedor-cards" id="contenedor-cards"></div>

    </div>

<!--Modal-->    
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="close" class="close">&times;</span>
            <img src="" alt="" id="img-modal" class="img-modal">
        </div>
    </div>

</body>
</html>
