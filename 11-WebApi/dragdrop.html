<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #343E46;
            /* cursor: none; */
        }


        .contenedor-principal{
            width: 600px;
            display: grid;
            gap: 10px;
            padding: 50px 0;
        }


        .contenedor {
            min-height: 400px;
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
        }


        /* Cajas */
        .caja {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-size: 20px;
            text-transform: uppercase;
            font-weight: 600;
            /* cursor: pointer; */
            transition: all .3s;
        }


        .caja.hovered {
            border: 3px dashed #000;
        }

        .caja-drag{
            background: #297fd7;
            width: 100px;
            height: 100px;
            cursor: move;
        }
    </style>
    <title>Drag & Drop</title>
    <script defer src="dragdrop.js"></script>
</head>
<body id="body">

    <div class="contenedor-principal">

        <div id="caja-drag" class="caja-drag" draggable="true"></div>

        <div class="contenedor" id="contenedor">
            <div class="caja"></div>
            <div class="caja"></div>
            <div class="caja"></div>
            <div class="caja"></div>
        </div>
    </div>
</body>
</html>
