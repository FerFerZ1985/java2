<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch: ejemplos practicos</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic);
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: grid;
            place-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #272B33;
        }

        #contenedor{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            width: 80%;
            padding: 40px 0;
        }

        #contenedor div{
            display: flex;
            flex-direction: column;
            border: 1px solid #3C3E44;
            border-radius: 10px;
        }

        h2{
            text-align: center;
            font-size: 25px;
            font-weight: 400;
            letter-spacing: 2px;
            background: #3C3E44;
            color: #fff;
            border-radius: 0 0 10px 10px;
        }

        img{
            width: 100%;
            height: 100%;
            min-height: 400px;
            max-height: 400px;
            object-position: center center;
            object-fit: contain;
            transition: all .5s;
        }

        img:hover{
            transform: scale(1.1);
        }
    </style>
    <script defer src="fetch2.js"></script>
</head>
<body>
    <div id="contenedor"></div>
</body>
</html>
