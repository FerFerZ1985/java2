<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Synthesis Utterance</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic);

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #111;
        }

        .container{
            width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        h1{
            font-size: 50px;
            text-align: center;
            color: #fff;
        }

        h1 span{
            color: #FFF603;
        }

        textarea{
            width: 100%;
            height: 300px;
            border-radius: 5px;
            resize: none;
            padding: 20px;
            outline: none;
            border: none;
            font-size: 18px;
        }

        .contenedor-footer{
            display: flex;
            width: 100%;
            justify-content: space-between;
            gap: 20px;
        }


        button{
            width: 50%;
            height: 50px;
            background: #FFF603;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            align-self: flex-end;
        }

        select{
            width: 100%;
            border-radius: 5px;
        }

    </style>
    <script defer src="speech.js"></script>
</head>
<body>
    <div class="container">
        <h1><span>Convertir</span> texto a voz</h1>
        <textarea placeholder="Tú texto aquí..."></textarea>
        <div class="contenedor-footer">
            <select></select>
            <button>Convertir</button>
        </div>
    </div>
</body>
</html>
